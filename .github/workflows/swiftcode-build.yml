name: SwiftCode iOS Build
run-name: SwiftCode ${{ github.event.client_payload.build_id || github.run_id }}

on:
  repository_dispatch:
    types: [swiftcode-build]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch || github.ref_name }}

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build iOS simulator app
        shell: bash
        run: |
          set -euo pipefail
          if [ -d SwiftCodeApp.xcodeproj ]; then
            xcodebuild               -project SwiftCodeApp.xcodeproj               -scheme SwiftCodeApp               -configuration Debug               -sdk iphonesimulator               -destination 'generic/platform=iOS Simulator'               -derivedDataPath build/DerivedData               CODE_SIGNING_ALLOWED=NO               CODE_SIGNING_REQUIRED=NO               build

            APP_PATH="$(find build/DerivedData/Build/Products -path '*Debug-iphonesimulator/*.app' -type d | head -n 1)"
            if [ -z "$APP_PATH" ]; then
              echo "No simulator .app was produced."
              exit 1
            fi

            mkdir -p build/Appetize
            cp -R "$APP_PATH" build/Appetize/
          else
            swift build
            mkdir -p build/Appetize
            cp -R .build build/Appetize/swift-package-build
          fi

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: swiftcode-simulator-app
          path: build/Appetize
          if-no-files-found: error
