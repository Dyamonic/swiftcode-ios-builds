name: SwiftCode iOS Build
run-name: SwiftCode ${{ github.event.client_payload.build_id || github.run_id }}

on:
  repository_dispatch:
    types: [swiftcode-build]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch || github.ref_name }}

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build Swift package
        run: swift build

      - name: Upload build folder
        uses: actions/upload-artifact@v4
        with:
          name: swiftcode-build
          path: .build
